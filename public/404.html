<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Isra School Portal</title>
  <script>
    // GitHub Pages 404 redirect fix for React Router
    var path = window.location.pathname;
    var base = '/schoolmanagment';
    var rest = path.replace(base, '') || '/';
    sessionStorage.setItem('redirect', rest);
    window.location.replace(base + '/');
  </script>
</head>
<body>Redirecting...</body>
</html>
